<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | The Crochet Covern</title>
<link rel="stylesheet" href="style.css">

<style>
.admin-wrap {
  max-width: 1000px;
  margin: 30px auto;
  padding: 15px;
}

.admin-controls {
  text-align: center;
  margin-bottom: 25px;
}

.admin-order {
  background: #fffdfc;
  border-radius: 22px;
  padding: 22px;
  margin: 18px auto;
  box-shadow: 0 5px 20px rgba(0,0,0,0.10);
  border: 2px solid #ead8d2;
}

.admin-order.urgent {
  border-color: #b88b7a;
}

.admin-top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
  align-items: center;
}

.badge {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  background: #e8dcd6;
  color: #5f4b45;
}

.badge.paid {
  background: #dff2df;
}

.badge.waiting {
  background: #f5dfdf;
}

.status-buttons button {
  margin: 4px;
}

.admin-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

@media (max-width: 700px) {
  .admin-grid {
    grid-template-columns: 1fr;
  }
}

.tracking-input {
  width: 100%;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid #d8c5bd;
  margin-top: 8px;
}

pre {
  white-space: pre-wrap;
  background: #faf7f5;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h1>🧶 The Crochet Covern</h1>
  <p>Admin Dashboard</p>
</header>

<section class="hero">
  <h2>Order Book 📦</h2>

  <input 
    id="password"
    type="password"
    placeholder="Admin password"
  >

  <br><br>

  <button class="btn" onclick="loadOrders()">
    Open Orders
  </button>
</section>

<div class="admin-wrap">

  <div class="stats-grid">

    <div class="stat-card">
      <h2 id="packCount">0</h2>
      <p>📦 Orders to Pack</p>
    </div>

    <div class="stat-card">
      <h2 id="postedCount">0</h2>
      <p>🚚 Posted Orders</p>
    </div>

    <div class="stat-card">
      <h2 id="salesTotal">£0</h2>
      <p>💷 Total Sales</p>
    </div>

  </div>

  <section id="orders"></section>

</div>

<script>
let savedPassword = "";

function statusPriority(status) {
  if (status === "Needs packing") return 1;
  if (status === "Packed") return 2;
  if (status === "Posted") return 3;
  return 4;
}

function formatDate(dateText) {
  if (!dateText) return "Unknown date";

  const date = new Date(dateText);

  return date.toLocaleString("en-GB", {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

async function loadOrders() {
  savedPassword = document.getElementById("password").value;

  const response = await fetch(
    "https://the-crochet-covern-github-io.vercel.app/api/admin-orders",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        password: savedPassword
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    alert("Incorrect password");
    return;
  }

  const container = document.getElementById("orders");
  container.innerHTML = "";
  
const toPack = data.orders.filter(o => o.order_status !== "Posted").length;

const posted = data.orders.filter(o => o.order_status === "Posted").length;

const sales = data.orders
.filter(o => o.paid)
.reduce((sum,o)=>sum + Number(o.amount),0);


document.getElementById("packCount").textContent = toPack;

document.getElementById("postedCount").textContent = posted;

document.getElementById("salesTotal").textContent = 
"£" + sales.toFixed(2);

  
  const sortedOrders = data.orders.sort((a, b) => {
    const statusSort = statusPriority(a.order_status) - statusPriority(b.order_status);

    if (statusSort !== 0) return statusSort;

    return new Date(b.created_at) - new Date(a.created_at);
  });

  sortedOrders.forEach(order => {
    const customer = order.customer || {};
    const items = order.items || [];
    const status = order.order_status || "Needs packing";

    const urgentClass = status !== "Posted" ? "urgent" : "";

    container.innerHTML += `
      <div class="admin-order ${urgentClass}" id="order-${order.id}">

        <div class="admin-top">
          <div>
            <h2>${order.checkout_ref}</h2>
            <p>${formatDate(order.created_at)}</p>
          </div>

          <div>
            <span class="badge ${order.paid ? "paid" : "waiting"}">
              ${order.paid ? "✅ Paid" : "❌ Not Paid"}
            </span>

            <span class="badge">
              ${status}
            </span>

            <span class="badge">
              ${order.email_sent ? "📩 Email Sent" : "⏳ Email Waiting"}
            </span>
          </div>
        </div>

        <hr>

        <div class="admin-grid">

        <div class="item-box">

<h3>🧸 Order Items</h3>

${items.map(i => `
<div class="order-item">
☐ ${i.name}
<div class="order-price">
£${i.price || ""}
</div>
</div>
`).join("")}


<div class="total-box">
💷 Order Total<br>
<strong>£${order.amount}</strong>
</div>

</div>

          <div class="info-box">

<h3>👤 Customer Details</h3>

<div class="info-row">
<label>Name</label>
<span>${customer.fullName || ""}</span>
</div>

<div class="info-row">
<label>Email</label>
<span>${customer.email || ""}</span>
</div>

<h3>🏠 Delivery Address</h3>

<div class="info-row">
<label>Address</label>
<span>
${customer.address || ""}<br>
${customer.town || ""}<br>
${customer.postcode || ""}
</span>
</div>

</div>

        </div>

        <h3>📝 Notes</h3>
        <pre>${customer.notes || "None"}</pre>

        <h3>🚚 Tracking</h3>
        <input 
          class="tracking-input"
          id="tracking-${order.id}"
          value="${order.tracking_number || ""}"
          placeholder="Add tracking number"
        >

        <br><br>

        <button class="btn" onclick="saveTracking('${order.id}')">
          Save Tracking
        </button>

        <div class="status-buttons">
          <h3>Update Status</h3>

          <button class="btn" onclick="updateStatus('${order.id}', 'Needs packing')">
            📦 Needs Packing
          </button>

          <button class="btn" onclick="updateStatus('${order.id}', 'Packed')">
            🎀 Packed
          </button>

          <button class="btn" onclick="updateStatus('${order.id}', 'Posted')">
            🚚 Posted
          </button>
        </div>

      </div>
    `;
  });
}

async function updateOrder(id, updateData) {
  const response = await fetch(
    "https://the-crochet-covern-github-io.vercel.app/api/update-order",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        password: savedPassword,
        id,
        ...updateData
      })
    }
  );

  if (!response.ok) {
    alert("Could not update order.");
    return;
  }

  loadOrders();
}

function updateStatus(id, status) {
  updateOrder(id, {
    order_status: status
  });
}

function saveTracking(id) {
  const tracking = document.getElementById("tracking-" + id).value;

  updateOrder(id, {
    tracking_number: tracking
  });
}
</script>

</body>
</html>
