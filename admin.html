<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | The Crochet Covern</title>

<link rel="stylesheet" href="style.css">

<style>

.admin-wrap{
max-width:1200px;
margin:auto;
padding:25px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:35px;
}

.stat-card{
background:#fffdfc;
border-radius:22px;
padding:25px;
text-align:center;
box-shadow:0 8px 20px rgba(0,0,0,.08);
border:2px solid #ead8d2;
transition:.25s;
}

.stat-card:hover{
transform:translateY(-3px);
}

.stat-card h2{
margin:0;
font-size:34px;
color:#5f4b45;
}

.stat-card p{
margin-top:8px;
color:#7a6a6a;
}

.status-section{
background:#fffdfc;
border-radius:22px;
margin-bottom:18px;
overflow:hidden;
box-shadow:0 6px 18px rgba(0,0,0,.08);
border:2px solid #ead8d2;
}

.status-header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 25px;
cursor:pointer;
font-size:19px;
font-weight:bold;
transition:.2s;
user-select:none;
}

.status-header:hover{
background:#f8f3f0;
}

.status-count{
font-size:14px;
font-weight:normal;
opacity:.7;
}

.status-content{
display:none;
padding:20px;
background:#faf7f5;
}

.status-section.open .status-content{
display:block;
animation:fadeIn .25s ease;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(-8px);
}

to{
opacity:1;
transform:none;
}

}

.order-summary{

background:white;

border-radius:18px;

padding:18px 22px;

margin-bottom:15px;

cursor:pointer;

border:2px solid #ead8d2;

transition:.2s;

}

.order-summary:hover{

transform:translateY(-2px);

box-shadow:0 5px 14px rgba(0,0,0,.08);

}

.order-summary-top{

display:flex;

justify-content:space-between;

align-items:center;

gap:15px;

flex-wrap:wrap;

}

.order-summary h3{

margin:0;

font-size:20px;

color:#5f4b45;

}

.order-summary small{

color:#7a6a6a;

}

.order-details{

display:none;

margin-top:18px;

padding-top:18px;

border-top:2px dashed #ead8d2;

}

.order-summary.open .order-details{

display:block;

animation:fadeIn .25s ease;

}

.badges{

display:flex;

gap:8px;

flex-wrap:wrap;

margin-top:10px;

}

.badge{

padding:7px 12px;

border-radius:18px;

font-size:13px;

font-weight:bold;

background:#e8dcd6;

color:#5f4b45;

}

.badge.green{

background:#dff2df;

}

.badge.red{

background:#f6dddd;

}

.badge.orange{

background:#f8ead7;

}

.badge.blue{

background:#ddeeff;

}

.admin-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:25px;

margin-top:20px;

}

@media(max-width:850px){

.admin-grid{

grid-template-columns:1fr;

}

}

.item-box,

.info-box{

background:#fff;

padding:20px;

border-radius:18px;

border:2px solid #ead8d2;

}

.order-item{

display:flex;

justify-content:space-between;

padding:10px 0;

border-bottom:1px dashed #ead8d2;

}

.order-item:last-child{

border-bottom:none;

}

.total-box{

margin-top:18px;

padding:15px;

border-radius:14px;

background:#f5efe9;

font-size:18px;

font-weight:bold;

text-align:center;

}

.info-row{

margin-bottom:16px;

}

.info-row label{

display:block;

font-size:12px;

text-transform:uppercase;

letter-spacing:1px;

color:#8a7770;

margin-bottom:5px;

}

.info-row span{

font-size:16px;

color:#4d403c;

}

.tracking-input{

width:100%;

padding:12px;

border-radius:12px;

border:1px solid #d8c5bd;

margin-top:8px;

}

.status-buttons{

margin-top:25px;

}

.status-buttons button{

margin:5px;

}

pre{

white-space:pre-wrap;

background:#faf7f5;

padding:15px;

border-radius:14px;

border:1px solid #ead8d2;

}

</style>

</head>

<body>

<header>

<h1>🧶 The Crochet Covern</h1>

<p>Admin Dashboard</p>

</header>

<section class="hero">

<h2>Order Management 📦</h2>

<input

id="password"

type="password"

placeholder="Admin password"

>

<br><br>

<button class="btn" onclick="loadOrders()">

Open Dashboard

</button>

</section>

<div class="admin-wrap">

<div class="stats-grid">

<div class="stat-card">

<h2 id="packCount">0</h2>

<p>📦 Orders to Pack</p>

</div>

<div class="stat-card">

<h2 id="postedCount">0</h2>

<p>🚚 Posted</p>

</div>

<div class="stat-card">

<h2 id="salesTotal">£0</h2>

<p>💷 Total Sales</p>

</div>

</div>

<div id="orders"></div>

</div>

<script>
let savedPassword = "";

function statusPriority(status) {
  if (status === "Needs packing") return 1;
  if (status === "Packed") return 2;
  if (status === "Posted") return 3;
  return 4;
}

function formatDate(dateText) {
  if (!dateText) return "Unknown date";

  const date = new Date(dateText);

  return date.toLocaleString("en-GB", {
    day: "2-digit",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

async function loadOrders() {
  savedPassword = document.getElementById("password").value;

  const response = await fetch(
    "https://the-crochet-covern-github-io.vercel.app/api/admin-orders",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        password: savedPassword
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    alert("Incorrect password");
    return;
  }

  const container = document.getElementById("orders");
  container.innerHTML = "";
  
const toPack = data.orders.filter(o => o.order_status !== "Posted").length;

const posted = data.orders.filter(o => o.order_status === "Posted").length;

const sales = data.orders
.filter(o => o.paid)
.reduce((sum,o)=>sum + Number(o.amount),0);


document.getElementById("packCount").textContent = toPack;

document.getElementById("postedCount").textContent = posted;

document.getElementById("salesTotal").textContent = 
"£" + sales.toFixed(2);

  
  const sortedOrders = data.orders.sort((a, b) => {
    const statusSort = statusPriority(a.order_status) - statusPriority(b.order_status);

    if (statusSort !== 0) return statusSort;

    return new Date(b.created_at) - new Date(a.created_at);
  });

  sortedOrders.forEach(order => {
    const customer = order.customer || {};
    const items = order.items || [];
    const status = order.order_status || "Needs packing";

    const urgentClass = status !== "Posted" ? "urgent" : "";

    container.innerHTML += `
      <div class="admin-order ${urgentClass}" id="order-${order.id}">

        <div class="admin-top">
          <div>
            <h2>${order.checkout_ref}</h2>
            <p>${formatDate(order.created_at)}</p>
          </div>

          <div>
            <span class="badge ${order.paid ? "paid" : "waiting"}">
              ${order.paid ? "✅ Paid" : "❌ Not Paid"}
            </span>

            <span class="badge">
              ${status}
            </span>

            <span class="badge">
              ${order.email_sent ? "📩 Email Sent" : "⏳ Email Waiting"}
            </span>
          </div>
        </div>

        <hr>

        <div class="admin-grid">

        <div class="item-box">

<h3>🧸 Order Items</h3>

${items.map(i => `
<div class="order-item">
☐ ${i.name}
<div class="order-price">
£${i.price || ""}
</div>
</div>
`).join("")}


<div class="total-box">
💷 Order Total<br>
<strong>£${order.amount}</strong>
</div>

</div>

          <div class="info-box">

<h3>👤 Customer Details</h3>

<div class="info-row">
<label>Name</label>
<span>${customer.fullName || ""}</span>
</div>

<div class="info-row">
<label>Email</label>
<span>${customer.email || ""}</span>
</div>

<h3>🏠 Delivery Address</h3>

<div class="info-row">
<label>Address</label>
<span>
${customer.address || ""}<br>
${customer.town || ""}<br>
${customer.postcode || ""}
</span>
</div>

</div>

        </div>

        <h3>📝 Notes</h3>
        <pre>${customer.notes || "None"}</pre>

        <h3>🚚 Tracking</h3>
        <input 
          class="tracking-input"
          id="tracking-${order.id}"
          value="${order.tracking_number || ""}"
          placeholder="Add tracking number"
        >

        <br><br>

        <button class="btn" onclick="saveTracking('${order.id}')">
          Save Tracking
        </button>

        <div class="status-buttons">
          <h3>Update Status</h3>

          <button class="btn" onclick="updateStatus('${order.id}', 'Needs packing')">
            📦 Needs Packing
          </button>

          <button class="btn" onclick="updateStatus('${order.id}', 'Packed')">
            🎀 Packed
          </button>

          <button class="btn" onclick="updateStatus('${order.id}', 'Posted')">
            🚚 Posted
          </button>
        </div>

      </div>
    `;
  });
}

async function updateOrder(id, updateData) {
  const response = await fetch(
    "https://the-crochet-covern-github-io.vercel.app/api/update-order",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        password: savedPassword,
        id,
        ...updateData
      })
    }
  );

  if (!response.ok) {
    alert("Could not update order.");
    return;
  }

  loadOrders();
}

function updateStatus(id, status) {
  updateOrder(id, {
    order_status: status
  });
}

function saveTracking(id) {
  const tracking = document.getElementById("tracking-" + id).value;

  updateOrder(id, {
    tracking_number: tracking
  });
}
</script>

</body>
</html>
