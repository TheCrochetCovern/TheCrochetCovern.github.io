<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | The Crochet Covern</title>

<link rel="stylesheet" href="style.css">

<style>
.admin-order {
  background:#fffdfc;
  border-radius:20px;
  padding:20px;
  margin:20px auto;
  max-width:700px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.status {
  font-weight:bold;
}

pre {
  white-space:pre-wrap;
  background:#faf7f5;
  padding:10px;
  border-radius:10px;
}
</style>

</head>

<body>

<header>
<h1>🧶 The Crochet Covern</h1>
<p>Admin Dashboard</p>
</header>


<section class="hero">

<h2>Order Book 📦</h2>

<input 
id="password"
type="password"
placeholder="Admin password"
>

<br><br>

<button class="btn" onclick="loadOrders()">
Open Orders
</button>

</section>


<section id="orders"></section>


<script>

async function loadOrders() {

const password = document.getElementById("password").value;

const response = await fetch(
"https://the-crochet-covern-github-io.vercel.app/api/admin-orders",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
password
})
}
);


const data = await response.json();

if (!response.ok) {
alert("Incorrect password");
return;
}


const container = document.getElementById("orders");

container.innerHTML = "";


data.orders.forEach(order => {

const customer = order.customer || {};
const items = order.items || [];


container.innerHTML += `

<div class="admin-order">

<h2>${order.checkout_ref}</h2>

<p class="status">
Payment:
${order.paid ? "✅ Paid" : "❌ Not Paid"}
<br>
Email:
${order.email_sent ? "📩 Sent" : "⏳ Waiting"}
</p>


<h3>🧸 Items</h3>

<p>
${items.map(i => `${i.name} - £${i.price}`).join("<br>")}
</p>


<h3>📦 Customer</h3>

<p>
<strong>Name:</strong> ${customer.fullName}<br>
<strong>Email:</strong> ${customer.email}<br>
<strong>Address:</strong><br>
${customer.address}<br>
${customer.town}<br>
${customer.postcode}
</p>


<h3>📝 Notes</h3>

<pre>${customer.notes || "None"}</pre>


<p>
<strong>Total:</strong> £${order.amount}
</p>


</div>

`;

});

}

</script>


</body>
</html>
